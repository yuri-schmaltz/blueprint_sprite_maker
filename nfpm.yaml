name: "blueprint-maker"
arch: "amd64"
platform: "linux"
version: "1.0.0"
section: "graphics"
priority: "optional"
maintainer: "Yuri Schmaltz"
description: "Sprite Extraction and AI manipulation tool"
vendor: "Yuri Schmaltz"
homepage: "https://github.com/yuri-schmaltz/blueprint_plugin"
license: "GPL-3.0-only"
contents:
  - src: ./dist/blueprint-maker-bin
    dst: /usr/bin/blueprint-maker
    file_info:
      mode: 0755
  - src: ./resources/blueprint-maker.desktop
    dst: /usr/share/applications/blueprint-maker.desktop
  - src: ./resources/icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/blueprint-maker.png
